
name: MLflow Experiments

on:
  workflow_dispatch:
  push:
    paths:
      - "src/train_mlflow.py"
      - ".github/workflows/mlflow.yml"
      - "data/ai4i2020.csv"

jobs:
  experiment-tracking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install mlflow==2.22.2 scikit-learn==1.6.1 pandas numpy

      - name: Run MLflow experiments
        run: python src/train_mlflow.py

      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-experiment-results
          path: |
            mlruns/
            experiment_summary.json
          retention-days: 30
